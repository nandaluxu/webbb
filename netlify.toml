# netlify.toml untuk nandaluxu/webbb (Next.js 16 + Prisma)

[build]
  # Prisma Client harus digenerate dulu sebelum build.
  # Sengaja TIDAK memakai "npm run build" karena script itu menyalin file ke
  # .next/standalone (khusus self-hosted), yang tidak dipakai Netlify.
  # "publish" sengaja tidak diisi: runtime Next.js Netlify mengaturnya sendiri.
  command = "npx prisma generate && npx next build"

[build.environment]
  # Next.js 16 butuh Node.js 20.9 atau lebih baru.
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# Wajib: memasang runtime Next.js Netlify secara eksplisit.
# Tanpa ini, build sukses tapi tidak ada yang melayani halaman (hasilnya 404).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Env variable diisi lewat Site configuration > Environment variables
# (JANGAN ditulis di sini, repo publik): DATABASE_URL, dst.
#
# Batasan Netlify untuk proyek ini:
#   - SQLite (db/custom.db) tidak persisten -> pakai database hosted (Turso/Neon).
#   - Mini-service socket.io (obrolan realtime) tidak bisa jalan di Netlify.
#   - Unggahan ke data/media dan data/edit-gambar tidak tersimpan.
#   - ffmpeg dan Playwright (Akinator, poster video) umumnya tidak jalan.
